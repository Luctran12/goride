release_id: 20260710-payment-sandbox-e2e-sessions
title: Add payment sandbox E2E session evidence
author: Codex
created_at: 2026-07-10
risk: low
transactional: true
requires_downtime: false
applies_after:
  - 20260705-payment-sandbox-uat-results
related_commit: pending
environments:
  - staging
  - production
objects:
  - payment_sandbox_e2e_sessions
  - idx_payment_sandbox_e2e_provider_tested_at
  - idx_payment_sandbox_e2e_status
pre_deploy_checks:
  - Run precheck.sql and confirm payment_sandbox_uat_results exists.
  - Confirm payment_sandbox_e2e_sessions does not already exist or is compatible.
deploy_steps:
  - Run apply.sql before recording real MoMo/VNPAY sandbox E2E evidence.
post_deploy_checks:
  - Run verify.sql and confirm table, indexes and required evidence columns exist.
rollback_plan:
  - Run rollback.sql only if the application release is rolled back and session-level sandbox UAT evidence can be discarded.
notes:
  - Stores per-run sandbox E2E evidence references only; it does not store raw provider payloads or secrets.
  - The aggregate payment_sandbox_uat_results row is still updated by the application for FE exposure gating.