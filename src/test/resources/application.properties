spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
app.jwt.secret=test-dev-secret-change-me-please-change-123
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
app.matching.timeout-scheduler.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.info.env.enabled=true
info.app.name=goride

app.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.security.cors.allowed-origin-patterns=
app.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.security.cors.allowed-headers=Authorization,Content-Type,X-Request-Id
app.security.cors.exposed-headers=X-Request-Id
app.security.cors.allow-credentials=false
app.security.cors.max-age-seconds=3600
