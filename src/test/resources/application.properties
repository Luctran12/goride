spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
app.analytics.telemetry.supply-snapshot-enabled=false
app.jwt.secret=test-dev-secret-change-me-please-change-123
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
app.matching.timeout-scheduler.enabled=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.info.env.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.tracing.enabled=false
management.tracing.sampling.probability=1.0
management.otlp.tracing.export.enabled=false
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces
app.observability.tracing.required-in-production=false
info.app.name=goride

app.security.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.security.cors.allowed-origin-patterns=
app.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.security.cors.allowed-headers=Authorization,Content-Type,X-Request-Id
app.security.cors.exposed-headers=X-Request-Id,Retry-After,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset
app.security.cors.allow-credentials=false
app.security.cors.max-age-seconds=3600
app.security.rate-limit.enabled=true
app.security.rate-limit.capacity=10000
app.security.rate-limit.refill-tokens=10000
app.security.rate-limit.refill-period-seconds=60
app.security.rate-limit.max-keys=10000
app.security.rate-limit.excluded-paths=/actuator/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/ws/**,/ws-native/**
app.security.rate-limit.use-forwarded-for=false
