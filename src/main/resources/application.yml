spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/goride}
    username: ${DATABASE_USERNAME:goride}
    password: ${DATABASE_PASSWORD:goride}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-me-please-change}
    access-token-minutes: 15
    refresh-token-days: 7
  service-area:
    city: Ho Chi Minh City
    min-lat: 10.3919
    max-lat: 11.1600
    min-lng: 106.3634
    max-lng: 107.0312
  matching:
    radius-km: 5
    max-attempts: 3
    offer-timeout-seconds: 30
    timeout-scheduler:
      enabled: true
      fixed-delay-ms: 5000
      initial-delay-ms: 10000
  analytics:
    telemetry:
      supply-snapshot-enabled: true
      supply-snapshot-interval-seconds: 300
      supply-snapshot-fixed-delay-ms: 300000
      supply-snapshot-initial-delay-ms: 30000
    spatial:
      allowed-cell-sizes-meters:
        - 250
        - 500
        - 1000
        - 2000
      projected-srid: 32648
      maximum-range-days: 31
      maximum-cells: 5000
      maximum-bounding-box-area-square-km: 25000
    materialized:
      enabled: false
      query-variant: DIRECT
      fallback-enabled: true
      reporting-timezone: Asia/Ho_Chi_Minh
      projected-srid: 32648
      base-cell-size-meters: 250
      refresh-enabled: false
      refresh-fixed-delay-ms: 900000
      refresh-initial-delay-ms: 60000
