spring.application.name=${APP_NAME:goride}
spring.application.group=${APP_GROUP:goride-backend}
logging.include-application-name=true
logging.include-application-group=true
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-no-request-id}] %logger{36} - %msg%n
logging.structured.format.console=${LOGGING_STRUCTURED_FORMAT_CONSOLE:}
logging.structured.format.file=${LOGGING_STRUCTURED_FORMAT_FILE:}
logging.structured.json.add[service.name]=${spring.application.name:goride}
logging.structured.json.add[service.environment]=${APP_ENV:local}
logging.structured.json.add[service.version]=${APP_VERSION:local}
spring.data.redis.repositories.enabled=false
app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-please-change}
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7
app.notifications.fcm.enabled=${FCM_ENABLED:false}
app.notifications.fcm.max-attempts=${FCM_MAX_ATTEMPTS:2}
app.notifications.fcm.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:}
app.notifications.fcm.project-id=${FIREBASE_PROJECT_ID:}
app.notifications.fcm.app-name=${FIREBASE_APP_NAME:goride}
app.booking.scheduled-rides.enabled=${SCHEDULED_RIDES_ENABLED:true}
app.booking.scheduled-rides.min-lead-time-minutes=${SCHEDULED_RIDES_MIN_LEAD_TIME_MINUTES:15}
app.booking.scheduled-rides.dispatch-lead-time-minutes=${SCHEDULED_RIDES_DISPATCH_LEAD_TIME_MINUTES:10}
app.booking.scheduled-rides.dispatch-batch-size=${SCHEDULED_RIDES_DISPATCH_BATCH_SIZE:50}
app.booking.scheduled-rides.scheduler.enabled=${SCHEDULED_RIDES_SCHEDULER_ENABLED:true}
app.booking.scheduled-rides.scheduler.fixed-delay-ms=${SCHEDULED_RIDES_SCHEDULER_FIXED_DELAY_MS:30000}
app.booking.scheduled-rides.scheduler.initial-delay-ms=${SCHEDULED_RIDES_SCHEDULER_INITIAL_DELAY_MS:30000}
app.routing.enabled=${ROUTING_ENABLED:false}
app.routing.base-url=${ROUTING_BASE_URL:https://router.project-osrm.org}
app.routing.profile=${ROUTING_PROFILE:driving}
app.routing.timeout-seconds=${ROUTING_TIMEOUT_SECONDS:5}
app.routing.fallback-enabled=${ROUTING_FALLBACK_ENABLED:true}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.info.env.enabled=true
management.prometheus.metrics.export.enabled=${PROMETHEUS_METRICS_ENABLED:true}
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=${HTTP_SERVER_REQUESTS_HISTOGRAM:true}
info.app.name=goride

app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:19006,http://127.0.0.1:5173}
app.security.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
app.security.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.security.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Request-Id}
app.security.cors.exposed-headers=${CORS_EXPOSED_HEADERS:X-Request-Id,Retry-After,X-RateLimit-Limit,X-RateLimit-Remaining,X-RateLimit-Reset}
app.security.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:false}
app.security.cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:3600}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.capacity=${RATE_LIMIT_CAPACITY:120}
app.security.rate-limit.refill-tokens=${RATE_LIMIT_REFILL_TOKENS:120}
app.security.rate-limit.refill-period-seconds=${RATE_LIMIT_REFILL_PERIOD_SECONDS:60}
app.security.rate-limit.max-keys=${RATE_LIMIT_MAX_KEYS:10000}
app.security.rate-limit.excluded-paths=${RATE_LIMIT_EXCLUDED_PATHS:/actuator/**,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/uploads/**,/ws/**,/ws-native/**}
app.security.rate-limit.use-forwarded-for=${RATE_LIMIT_USE_FORWARDED_FOR:false}

app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local-root=${STORAGE_LOCAL_ROOT:uploads}
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:/uploads}
app.storage.max-file-size=${STORAGE_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-file-size=${STORAGE_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${STORAGE_MAX_REQUEST_SIZE:6MB}
app.storage.allowed-content-types=${STORAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
app.storage.r2.endpoint=${CLOUDFLARE_R2_ENDPOINT:}
app.storage.r2.region=${CLOUDFLARE_R2_REGION:auto}
app.storage.r2.bucket=${CLOUDFLARE_R2_BUCKET:}
app.storage.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY:}
app.storage.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY:}
app.storage.r2.public-base-url=${CLOUDFLARE_R2_PUBLIC_BASE_URL:}
app.storage.r2.path-style-access-enabled=${CLOUDFLARE_R2_PATH_STYLE_ACCESS_ENABLED:true}
app.storage.r2.api-call-timeout=${CLOUDFLARE_R2_API_CALL_TIMEOUT:30s}
app.storage.r2.api-call-attempt-timeout=${CLOUDFLARE_R2_API_CALL_ATTEMPT_TIMEOUT:10s}