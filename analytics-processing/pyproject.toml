[build-system]
requires = ["setuptools>=65.5"]
build-backend = "setuptools.build_meta"

[project]
name = "goride-analytics-processing"
version = "0.1.0"
description = "Reproducible GoRide demand-forecasting processing layer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary - thesis project" }
dependencies = [
    "pyarrow==25.0.0",
    "pyproj==3.7.2",
    "psycopg[binary]==3.3.4",
    "PyYAML==6.0.3",
    "tzdata==2026.3",
]

[project.optional-dependencies]
model-spike = [
    "joblib==1.5.3",
    "numpy==1.26.4",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "threadpoolctl==3.6.0",
]

[project.scripts]
goride-analytics = "goride_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
